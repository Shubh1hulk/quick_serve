<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe Account</title>
  <link rel="stylesheet" href="css/style.css?v=20261028r">
  <style>
    .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .auth-card { width: min(460px, 100%); padding: 28px; }
    .auth-card h1 { margin: 0 0 8px; }
    .auth-card p { color: var(--muted); }
    .auth-form { display: grid; gap: 14px; margin-top: 22px; }
    .auth-form label { display: grid; gap: 6px; }
    .auth-form input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--glass); color: var(--text); }
    .auth-message { min-height: 22px; color: #ef4444; }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card glass">
      <a href="index.html" class="logo">QUICKSERVE</a>
      <h1 id="authTitle">Sign in</h1>
      <p id="authSubtitle">Access your account and order history.</p>
      <form class="auth-form" id="authForm">
        <label id="nameField" hidden>Name<input id="name" autocomplete="name"></label>
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <div class="auth-message" id="authMessage"></div>
        <button class="btn-grad full" type="submit" id="submitButton">Sign in</button>
      </form>
      <button class="btn-ghost small" id="toggleMode" type="button">Create an account</button>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
